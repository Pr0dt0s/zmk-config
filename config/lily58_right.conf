# Right half only. ZMK applies every matching conf file, so this is merged on
# top of lily58.conf rather than replacing it.
#
# The right half never runs raw-hid (that's central-only, see
# lily58_left.conf) and so can never build a runtime scene from a host
# directly. This is what lets it receive one anyway: a scene edit made on the
# left half relays here over the split link, and applying that relayed edit
# needs the same runtime-scene pool the left half has, sized identically
# (CONFIG_ZMK_VFX_RUNTIME_MAX_LAYERS defaults to the same value on both
# halves unless overridden). Without this, a relayed edit arrives and is
# silently dropped.
CONFIG_ZMK_VFX_RUNTIME_SCENES=y
