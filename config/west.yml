manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: pr0dt0s
      url-base: https://github.com/pr0dt0s
    - name: zzeneg
      url-base: https://github.com/zzeneg
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Advanced underglow effects. Replaces ZMK's built-in underglow, which
    # cannot be extended from a module: its effects are a fixed switch with
    # file-static state.
    #
    # The module repository has to stay public: west clones it anonymously and
    # ZMK's reusable build workflow takes no credentials, so an Actions build
    # of this config cannot reach a private one.
    - name: zmk-advanced-underglow-effects-vfx
      remote: pr0dt0s
      revision: main
    # Raw HID transport, for CONFIG_ZMK_VFX_RAW_HID: lets a host move a
    # tuned layer's hue, level or speed live, over USB or BLE, rather than
    # only from the keymap. See lily58_left.conf and vfx-tunable.dtsi.
    - name: zmk-raw-hid
      remote: zzeneg
      revision: main
  self:
    path: config
