# Ensure peripheral role (this is usually default, but be explicit)
CONFIG_ZMK_SPLIT=y
# CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n  # This is default

# Remove USB HID since central handles PC communication
# CONFIG_ZMK_USB=y  # Remove this line if present

# Optimize for peripheral role
CONFIG_ZMK_SPLIT_BLE=y

# Power management optimizations for battery life
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Bluetooth optimizations
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y