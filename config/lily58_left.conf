# Left half only. ZMK applies every matching conf file, so this is merged on
# top of lily58.conf rather than replacing it.
#
# RAW_HID (from zmk-raw-hid, brought in by the raw_hid_adapter shield on this
# half's build.yaml entry) only builds on the split's central:
#
#   depends on !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL
#
# same restriction CONFIG_ZMK_WPM has. This only turns on VFX's own decoder
# for it; CONFIG_RAW_HID=y itself comes from the raw_hid_adapter shield.
CONFIG_ZMK_VFX_RAW_HID=y

# Build a channel's scene at runtime rather than only in the two declared in
# lily58_left.overlay -- add, edit, reorder and remove layers live from the
# simulator's Host control panel, over the same raw-hid transport above.
# Only makes sense on the central for the same reason: nothing else reaches
# it. See the module's own README for what's buildable this way and the
# wire format.
CONFIG_ZMK_VFX_RUNTIME_SCENES=y
