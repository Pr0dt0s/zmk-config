# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
# CONFIG_ZMK_DISPLAY=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_POINTING=y
# Advanced underglow effects (VFX) owns the strip, so ZMK's own underglow has
# to be off: with both on, two engines write the same pixels.
CONFIG_ZMK_RGB_UNDERGLOW=n

CONFIG_ZMK_VFX=y
CONFIG_ZMK_VFX_BRT_START=60
CONFIG_ZMK_VFX_AUTO_OFF_IDLE=y

# Cut power to the LEDs when a frame comes out entirely black. A 36 pixel
# strip draws roughly 30 mA even showing nothing, so this is where the battery
# saving is, not in dimming.
#
# NOTE: this needs the strip to be on the switched VCC rail rather than RAW.
# If nothing changes at the battery terminals when an all-black scene is
# selected, it is wired to RAW and this cannot help.
CONFIG_ZMK_VFX_AUTO_POWER_GATE=y
CONFIG_ZMK_VFX_BLACKOUT_DELAY_MS=500

# Synced rather than free-running, for two reasons.
#
# A ripple started on one half only crosses to the other if someone tells it.
# The central hears every key already, since ZMK has to hand it the peripheral
# presses to run the keymap, but nothing travels the other way: without this
# the peripheral never learns that a key on the central was touched, so a
# press over there lands nowhere over here.
#
# It also holds the two clocks together, so gradients and waves stay lined up
# across the seam instead of drifting apart over hours of uptime.
#
# The cost is a message per keypress on the central plus a beacon every couple
# of seconds. Swap these back if the battery matters more than the seam.
# CONFIG_ZMK_VFX_SPLIT_FREE=y
CONFIG_ZMK_VFX_SPLIT_SYNCED=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#CONFIG_ZMK_BACKLIGHT=y
#CONFIG_ZMK_BACKLIGHT_BRT_START=100
