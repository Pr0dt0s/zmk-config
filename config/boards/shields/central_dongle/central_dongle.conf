# Enable split keyboard support
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Allow connections to both left and right peripherals
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2

# USB connection to PC
CONFIG_ZMK_USB=y

# Extended key report for compatibility
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y

# Power management (USB powered, less aggressive)
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=n

# Bluetooth optimizations
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=yss